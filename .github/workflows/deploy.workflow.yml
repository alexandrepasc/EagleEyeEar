name: Deploy

on: [workflow_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-20.04
    steps:

      - name: Get Ear release artifact
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'alexandrepasc/EagleEyeEar'
          file: '\bEagleEyeEar\b-v[0-9]\.[0-9]\.[0-9]\.jar'
          token: ${{ secrets.GITHUB_TOKEN }}
          regex: true

      - name: Get Wing release artifact
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'alexandrepasc/EagleEyeWing'
          file: '\bEagleEyeWing\b-v[0-9]\.[0-9]\.?[0-9]?\.jar'
          token: ${{ secrets.ACCESS_TOKEN }}
          regex: true

      - name: Create container
        uses: actions/checkout@v3
        run: docker build -f deploy/Dockerfile -t registry.heroku.com/be-eagleeye/web .

      - name: Heroku authentication
        run: |
            cp deploy/.netrc ~/.netrc
            heroku container:login

      - name: Push image
        run: docker push registry.heroku.com/be-eagleeye/web

      - name: Release
        run: heroku container:release -a be-eagleeye web